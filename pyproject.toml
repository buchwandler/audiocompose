[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocompose"
version = "0.1.0"
description = "Declaratively compose audio fragments into finalized audio"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "AudioCompose contributors"}]
dependencies = [
  "numpy>=1.23",
]
keywords = ["audio", "composition", "wav", "dsp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Typing :: Typed",
]

[project.optional-dependencies]
dsp = ["audiosig>=0.1.4,<0.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
audiocompose = "audiocompose.cli:main"

[project.urls]
Homepage = "https://github.com/buchwandler/audiocompose"
Repository = "https://github.com/buchwandler/audiocompose"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiocompose*"]

[tool.setuptools.package-data]
audiocompose = ["py.typed"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
