# Build and publish a Python package when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine packaging

      - name: Build package
        run: |
          rm -rf dist
          python -m build

      - name: Check built distributions
        run: python -m twine check dist/*

      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from email import policy
          from email.parser import Parser
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          def has_minimum(requirements, name, minimum):
              minimum_version = Version(minimum)
              return any(
                  requirement.name == name
                  and any(
                      spec.operator in (">=", ">", "==")
                      and Version(spec.version) >= minimum_version
                      for spec in requirement.specifier
                  )
                  for requirement in requirements
              )

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          artifacts = sorted(Path("dist").iterdir())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          wheel_name, wheel_version, _, _ = parse_wheel_filename(wheels[0].name)
          sdist_name, sdist_version = parse_sdist_filename(sdists[0].name)
          assert wheel_name == "audiocompose", wheel_name
          assert sdist_name == "audiocompose", sdist_name
          assert str(wheel_version) == tag_version, (wheel_version, tag_version)
          assert str(sdist_version) == tag_version, (sdist_version, tag_version)

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = Parser(policy=policy.default).parsestr(
                  archive.read(metadata_name).decode("utf-8")
              )
              assert metadata["Name"] == "audiocompose"
              requirements = [
                  Requirement(value) for value in metadata.get_all("Requires-Dist", [])
              ]
              assert has_minimum(requirements, "numpy", "1.23")
              assert any(name.endswith("audiocompose/py.typed") for name in archive.namelist())
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
