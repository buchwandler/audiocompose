name: Run tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m compileall -q audiocompose tests

      - name: Run tests
        run: python -m pytest -q

      - name: Lint and type-check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m ruff check audiocompose tests
          python -m mypy audiocompose

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lower-bound package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.0" "audiosig==0.1.5"
          python -m pip install --no-deps -e .
          python -m pip install "pytest==8.0.0" "jsonschema==4.18.0"

      - name: Run lower-bound tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Install isolated wheel
        run: |
          python -m venv "$RUNNER_TEMP/audiocompose-wheel-venv"
          "$RUNNER_TEMP/audiocompose-wheel-venv/bin/python" -m pip install dist/audiocompose-*.whl

      - name: Smoke-test installed wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/audiocompose-wheel-venv/bin/python" - <<'PY'
          import sys
          from importlib.resources import files
          from pathlib import Path

          import numpy as np

          import audiocompose
          from audiocompose import (
              AudioBufferSource,
              AudioClip,
              AudioJob,
              Composer,
              audiojob_schema,
          )

          assert audiocompose.__version__
          assert Path(sys.prefix).resolve() in Path(audiocompose.__file__).resolve().parents
          assert files("audiocompose").joinpath("py.typed").is_file()
          for version in (1, 2):
              assert audiojob_schema(version)["$schema"]
          source = AudioBufferSource(np.zeros(240, dtype=np.float32), 24000)
          job = AudioJob((AudioClip("clip", source),))
          result = Composer().compose(job)
          assert result.sample_rate == 24000
          assert result.audio.ndim == 1
          PY
          "$RUNNER_TEMP/audiocompose-wheel-venv/bin/audiocompose" --version
