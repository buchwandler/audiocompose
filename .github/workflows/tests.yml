name: Run tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m compileall -q audiocompose tests

      - name: Run tests
        run: python -m pytest -q

      - name: Lint and type-check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m ruff check audiocompose tests
          python -m mypy audiocompose

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lower-bound package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run lower-bound tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Install isolated wheel
        run: |
          python -m venv "$RUNNER_TEMP/audiocompose-wheel-venv"
          "$RUNNER_TEMP/audiocompose-wheel-venv/bin/python" -m pip install dist/audiocompose-*.whl

      - name: Smoke-test installed wheel
        run: |
          "$RUNNER_TEMP/audiocompose-wheel-venv/bin/python" -c "import audiocompose; assert audiocompose.__version__"
          "$RUNNER_TEMP/audiocompose-wheel-venv/bin/audiocompose" --version
